syntax = "proto3";

package multi_radio.v1;

enum RadioMode {
  RADIO_MODE_UNSPECIFIED = 0;
  RADIO_MODE_FIXED = 1;
  RADIO_MODE_SCAN_RANGE = 2;
  RADIO_MODE_SCAN_LIST = 3;
  RADIO_MODE_AIR_MARINE_PLOT = 4;
}

enum SignalType {
  SIGNAL_TYPE_UNKNOWN = 0;
  SIGNAL_TYPE_AIS = 1;
  SIGNAL_TYPE_ADSB = 2;
  SIGNAL_TYPE_DSC = 3;
}

enum Modulation {
  MODULATION_UNSPECIFIED = 0;
  MODULATION_AM = 1;
  MODULATION_WFM = 2;
  MODULATION_NFM = 3;
  MODULATION_FSK = 4;
  MODULATION_GMSK = 5;
  MODULATION_PPM = 6;
  MODULATION_ADSB = 7;
  MODULATION_AIS_DUAL = 8;
  MODULATION_VDES_ASM = 9;
}

enum EventKind {
  EVENT_KIND_INFO = 0;
  EVENT_KIND_WARNING = 1;
  EVENT_KIND_ERROR = 2;
  EVENT_KIND_STATE_CHANGE = 3;
  EVENT_KIND_TUNE_HOP = 4;
}

message ModeConfig {
  double fixed_frequency_hz = 1;
  Modulation fixed_modulation = 21;
  double range_start_hz = 2;
  double range_end_hz = 3;
  double range_step_hz = 4;
  repeated double frequency_list_hz = 5;
  uint32 dwell_ms = 6;
  uint32 sample_rate_hz = 7;
  uint32 channel_bandwidth_hz = 8;
  uint32 hardware_bandwidth_hz = 9;
  reserved 10;
  reserved 11;
  bool dc_blocker_enabled = 12;
  uint32 dc_blocker_cutoff_hz = 13;
  bool center_notch_enabled = 14;
  uint32 center_notch_width_hz = 15;
  bool lo_offset_enabled = 16;
  int32 lo_offset_hz = 17;
  repeated ScanListChannel scan_list_channels = 18;
  bool scan_list_monitor_mode = 19;
  double scan_list_default_squelch_db = 20;
  bool audio_hpf300_enabled = 22;
  bool audio_lpf3k5_enabled = 23;
  bool audio_bpf_voice_enabled = 24;
  bool audio_lpf4k5_enabled = 25;
  bool scan_list_channel_locked = 26;
  uint32 scan_list_locked_channel_index = 27;
  uint32 gmsk_baud_rate = 30;
  float  gmsk_bt = 31;
  float  gmsk_modulation_index = 32;
  string gmsk_decoder = 33;
  string gmsk_postprocessor = 34;
  bool   gmsk_nrzi_invert = 35;
  int32  ppm_correction   = 36;
  uint32 ppm_bit_duration_us = 37;
  uint32 ppm_data_rate_bps   = 38;
  uint32 vdes_asm_bit_rate_bps = 39;
  float  vdes_asm_pll_bw = 40;
  uint32 vdes_asm_candidate_bits = 41;
  uint32 vdes_asm_sync_errors_max = 42;
  float  adsb_agc_bandwidth = 43;
  float  adsb_agc_target_level = 44;
  bool rnnoise_enabled = 28;
  float rnnoise_strength = 29;
}

message ScanListChannel {
  string label = 1;
  double frequency_hz = 2;
  Modulation modulation = 3;
  uint32 channel_bandwidth_hz = 4;
  double squelch_threshold_db = 5;
  uint32 dwell_ms = 6;
  bool use_default_squelch = 7;
  float audio_gain_db = 8;
}

message ReceiverInfo {
  uint32 receiver_id = 1;
  string serial = 2;
  bool running = 3;
  RadioMode mode = 4;
  ModeConfig mode_config = 5;
  string last_error = 6;
}

message PluginInfo {
  string plugin_name = 1;
  string plugin_version = 2;
  uint32 api_version = 3;
  repeated SignalType supported_signals = 4;
  bool enabled = 5;
  string path = 6;
}

message ReceiverEvent {
  uint64 unix_ms = 1;
  uint32 receiver_id = 2;
  EventKind kind = 3;
  string message = 4;
  double tuned_frequency_hz = 5;
}

message DecodedMessage {
  uint64 unix_ms = 1;
  uint32 receiver_id = 2;
  SignalType signal_type = 3;
  double frequency_hz = 4;
  string payload = 5;
  map<string, string> normalized_fields = 6;
}

message Empty {}

message ListReceiversRequest {}
message ListReceiversResponse { repeated ReceiverInfo receivers = 1; }

message GetReceiverStatusRequest { uint32 receiver_id = 1; }
message GetReceiverStatusResponse { ReceiverInfo receiver = 1; }

message StartReceiverRequest { uint32 receiver_id = 1; }
message StartReceiverResponse { bool ok = 1; string error = 2; }

message StopReceiverRequest { uint32 receiver_id = 1; }
message StopReceiverResponse { bool ok = 1; string error = 2; }

message SetModeRequest {
  uint32 receiver_id = 1;
  RadioMode mode = 2;
}
message SetModeResponse { bool ok = 1; string error = 2; }

message SetModeConfigRequest {
  uint32 receiver_id = 1;
  ModeConfig mode_config = 2;
}
message SetModeConfigResponse { bool ok = 1; string error = 2; }

message ListPluginsRequest {}
message ListPluginsResponse { repeated PluginInfo plugins = 1; }

message EnablePluginRequest { string plugin_name = 1; }
message EnablePluginResponse { bool ok = 1; string error = 2; }

message DisablePluginRequest { string plugin_name = 1; }
message DisablePluginResponse { bool ok = 1; string error = 2; }

message StreamReceiverEventsRequest { uint32 receiver_id = 1; bool include_all_receivers = 2; }
message StreamDecodedMessagesRequest {
  uint32 receiver_id = 1;
  bool include_all_receivers = 2;
  repeated SignalType signal_filter = 3;
}
message StreamAudioFramesRequest { uint32 receiver_id = 1; bool include_all_receivers = 2; }
message StreamIqFramesRequest { uint32 receiver_id = 1; bool include_all_receivers = 2; }

message AudioFrame {
  uint64 unix_ms = 1;
  uint32 receiver_id = 2;
  uint32 sample_rate_hz = 3;
  bytes pcm_s16le = 4;
  double tuned_frequency_hz = 5;
  uint64 sequence = 6;
  uint64 sample_index = 7;
}

message IqFrame {
  uint64 unix_ms = 1;
  uint32 receiver_id = 2;
  uint32 sample_rate_hz = 3;
  bytes interleaved_iq_s16le = 4;
  double tuned_frequency_hz = 5;
  uint64 sequence = 6;
  uint64 sample_index = 7;
}

message HardwareConfig {
  int32 ppm_correction = 1;
}
message SetHardwareConfigRequest { HardwareConfig config = 1; }
message SetHardwareConfigResponse { bool ok = 1; string error = 2; }
message GetHardwareConfigRequest {}
message GetHardwareConfigResponse { HardwareConfig config = 1; }

// Radar target snapshot — one entry per tracked object.
message RadarTarget {
  string   id           = 1;  // ICAO hex or MMSI
  string   label        = 2;  // callsign / vessel name, falls back to id
  string   kind         = 3;  // "AIR", "SEA", "?"
  double   lat          = 4;
  double   lon          = 5;
  double   sog_knots    = 6;
  double   cog_degrees  = 7;
  bool     has_altitude = 8;
  double   altitude_ft  = 9;
  uint64   last_seen_ms = 10;
}

// Full radar state pushed every ~2 s.
message RadarSnapshot {
  repeated RadarTarget targets     = 1;
  repeated string      removed_ids = 2;  // targets removed since last snapshot
  uint64               snapshot_ms = 3;
}

message StreamRadarSnapshotsRequest {
  uint32 receiver_id           = 1;
  bool   include_all_receivers = 2;
}

service RadioControlService {
  rpc ListReceivers(ListReceiversRequest) returns (ListReceiversResponse);
  rpc GetReceiverStatus(GetReceiverStatusRequest) returns (GetReceiverStatusResponse);
  rpc StartReceiver(StartReceiverRequest) returns (StartReceiverResponse);
  rpc StopReceiver(StopReceiverRequest) returns (StopReceiverResponse);
  rpc SetMode(SetModeRequest) returns (SetModeResponse);
  rpc SetModeConfig(SetModeConfigRequest) returns (SetModeConfigResponse);
  rpc ListPlugins(ListPluginsRequest) returns (ListPluginsResponse);
  rpc EnablePlugin(EnablePluginRequest) returns (EnablePluginResponse);
  rpc DisablePlugin(DisablePluginRequest) returns (DisablePluginResponse);
  rpc SetHardwareConfig(SetHardwareConfigRequest) returns (SetHardwareConfigResponse);
  rpc GetHardwareConfig(GetHardwareConfigRequest) returns (GetHardwareConfigResponse);
}

service TelemetryService {
  rpc StreamReceiverEvents(StreamReceiverEventsRequest) returns (stream ReceiverEvent);
  rpc StreamDecodedMessages(StreamDecodedMessagesRequest) returns (stream DecodedMessage);
  rpc StreamAudioFrames(StreamAudioFramesRequest) returns (stream AudioFrame);
  rpc StreamIqFrames(StreamIqFramesRequest) returns (stream IqFrame);
  rpc StreamRadarSnapshots(StreamRadarSnapshotsRequest) returns (stream RadarSnapshot);
}
